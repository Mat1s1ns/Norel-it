services:
  # Laravel PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: norel-it-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - norel-network
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-norel_it}
      - DB_USERNAME=${DB_USERNAME:-norel_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    ports:
      - "${VITE_PORT:-5173}:5173"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: norel-it-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - norel-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: norel-it-db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-norel_it}
      MYSQL_USER: ${DB_USERNAME:-norel_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - norel-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Redis Cache & Queues
  redis:
    image: redis:alpine
    container_name: norel-it-redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - norel-network

  # Mailpit - Local Email Testing
  mailpit:
    image: axllent/mailpit:latest
    container_name: norel-it-mailpit
    restart: unless-stopped
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    networks:
      - norel-network

networks:
  norel-network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local

